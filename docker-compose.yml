services:
  # Shared by ocr-consistency-check, biometric-matching, and risk-scoring-engine — the 3
  # services that persist their own results. Each owns its own tables (self-provisioned on
  # connect, see each service's db.py) rather than a shared schema file, so this is one
  # instance, not one shared schema.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - pramaan-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Shared by ocr-consistency-check, biometric-matching (result caches, keyed by uploaded-
  # file content hash) and risk-scoring-engine (cross-instance pending/result coordination,
  # see that service's store.py). One instance, several key namespaces — same reasoning as
  # the single postgres instance above.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - ocr-consistency-check
      - visual-image-forensics
      - biometric-matching
      - risk-scoring-engine

  ocr-consistency-check:
    build: ./services/ocr-consistency-check
    ports:
      - "8001:8001"
    env_file:
      - ./services/ocr-consistency-check/.env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - RISK_ENGINE_URL=http://risk-scoring-engine:8004
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      risk-scoring-engine:
        condition: service_started

  visual-image-forensics:
    build: ./services/visual-image-forensics
    ports:
      - "8002:8002"
    env_file:
      - ./services/visual-image-forensics/.env
    environment:
      - RISK_ENGINE_URL=http://risk-scoring-engine:8004
    depends_on:
      - risk-scoring-engine

  biometric-matching:
    build: ./services/biometric-matching
    ports:
      - "8003:8003"
    env_file:
      - ./services/biometric-matching/.env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - RISK_ENGINE_URL=http://risk-scoring-engine:8004
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      risk-scoring-engine:
        condition: service_started

  risk-scoring-engine:
    build: ./services/risk-scoring-engine
    ports:
      - "8004:8004"
    env_file:
      - ./services/risk-scoring-engine/.env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pramaan-postgres-data:
