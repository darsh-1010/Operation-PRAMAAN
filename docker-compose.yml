services:
  # Shared by ocr-consistency-check, biometric-matching, and risk-scoring-engine — the 3
  # services that persist their own results. Each owns its own tables (self-provisioned on
  # connect, see each service's db.py) rather than a shared schema file, so this is one
  # instance, not one shared schema.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - pramaan-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Shared by ocr-consistency-check, biometric-matching (result caches, keyed by uploaded-
  # file content hash), risk-scoring-engine (cross-instance pending/result coordination, see
  # that service's store.py), and all 3 detection modules' /screen rate limiter (see each
  # service's rate_limit.py). One instance, several key namespaces — same reasoning as the
  # single postgres instance above.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - ocr-consistency-check
      - visual-image-forensics
      - biometric-matching
      - risk-scoring-engine

  ocr-consistency-check:
    build: ./services/ocr-consistency-check
    ports:
      - "8001:8001"
    env_file:
      - ./services/ocr-consistency-check/.env
    environment:
      # Blank out .env's own DATABASE_URL (it hardcodes 127.0.0.1 for bare local dev) so
      # db.py falls through to the POSTGRES_* vars below, which point at the compose network.
      - DATABASE_URL=
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - RISK_ENGINE_URL=http://risk-scoring-engine:8004
      - EVIDENCE_DIR=/data/evidence
    volumes:
      # AES-GCM-encrypted uploads (evidence.py), shared with biometric-matching (selfies)
      - pramaan-evidence:/data/evidence
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      risk-scoring-engine:
        condition: service_started

  visual-image-forensics:
    build: ./services/visual-image-forensics
    ports:
      - "8002:8002"
    env_file:
      - ./services/visual-image-forensics/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RISK_ENGINE_URL=http://risk-scoring-engine:8004
    depends_on:
      redis:
        condition: service_healthy
      risk-scoring-engine:
        condition: service_started

  biometric-matching:
    build: ./services/biometric-matching
    ports:
      - "8003:8003"
    env_file:
      - ./services/biometric-matching/.env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - RISK_ENGINE_URL=http://risk-scoring-engine:8004
      - EVIDENCE_DIR=/data/evidence
    volumes:
      - pramaan-evidence:/data/evidence
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      risk-scoring-engine:
        condition: service_started

  risk-scoring-engine:
    build: ./services/risk-scoring-engine
    ports:
      - "8004:8004"
    env_file:
      - ./services/risk-scoring-engine/.env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      # Local Anvil by default; export PRAMAN_CHAIN_RPC_URL to point at Polygon Amoy / Besu.
      - CHAIN_RPC_URL=${PRAMAN_CHAIN_RPC_URL:-http://anvil:8545}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ledger-deploy:
        condition: service_completed_successfully

  # Local EVM chain for the decision ledger (see services/risk-scoring-engine/LEDGER.md).
  # State is dumped to a volume every 10s so anchors survive `docker compose down/up`.
  # Dev/demo only — production anchors to Polygon or a permissioned Besu network instead.
  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    restart: unless-stopped
    user: root  # the image's default user can't write the named volume
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337", "--block-time", "2",
                 "--state", "/anvil/state.json", "--state-interval", "10"]
    ports:
      - "8545:8545"
    volumes:
      - pramaan-anvil-data:/anvil
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: deploys PramanAnchor if it isn't at ANCHOR_CONTRACT_ADDRESS yet, then exits.
  ledger-deploy:
    build: ./services/risk-scoring-engine
    command: ["python", "deploy_contract.py"]
    restart: "no"
    env_file:
      - ./services/risk-scoring-engine/.env
    environment:
      - CHAIN_RPC_URL=${PRAMAN_CHAIN_RPC_URL:-http://anvil:8545}
    depends_on:
      anvil:
        condition: service_healthy

  # Scrapes /metrics from all 4 backend services every 15s (see monitoring/prometheus.yml).
  prometheus:
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - pramaan-prometheus-data:/prometheus

  # Dashboards over Prometheus — datasource auto-provisioned (monitoring/grafana/
  # provisioning/), login admin/admin on first visit to http://localhost:3001.
  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - pramaan-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pramaan-anvil-data:
  pramaan-evidence:
  pramaan-postgres-data:
  pramaan-prometheus-data:
  pramaan-grafana-data:
